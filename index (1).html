<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPS ದಾಖಲೆ ರಚನೆ – NPS Document Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;700&family=Noto+Serif+Kannada:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>ರಾಷ್ಟ್ರೀಯ ಪಿಂಚಣಿ ಯೋಜನೆ ದಾಖಲೆಗಳು</h1>
      <p>NPS ನಿಂದ ಹಳೆಯ ಪಿಂಚಣಿ ಯೋಜನೆಗೆ ಒಳಪಡಿಸುವ ದಾಖಲೆಗಳನ್ನು ಒಂದೇ ಫಾರ್ಮ್‌ನಿಂದ ರಚಿಸಿ</p>
     
  </header>
 <center> <p> Neccessary orders for withdrawal of NPS amount <a href="https://docs.google.com/uc?export=download&id=1gSgyzsn6MYc0woNcvyr0aGHpZbk6hbhe" target="_download">click to download.</a></p></center>
    </div>
  <main class="wrap">
    <form id="npsForm" novalidate autocomplete="off">

      <fieldset>
        <legend>ನೌಕರರ ವಿವರ <span class="en">Employee</span></legend>
        <div class="grid">
          <div class="field full">
            <label for="name">ನೌಕರರ ಹೆಸರು <span class="en">Name</span></label>
            <input id="name" name="name" type="text" required maxlength="120">
          </div>
          <div class="field">
            <label for="pran">ಪ್ರಾನ್ ಸಂಖ್ಯೆ <span class="en">PRAN</span></label>
            <input id="pran" name="pran" type="text" inputmode="numeric" required
                   pattern="[0-9]{12}" maxlength="12" title="12 ಅಂಕೆಗಳು">
            <small class="hint">12 ಅಂಕೆಗಳು</small>
          </div>
          <div class="field">
            <label for="gpf">ಜಿಪಿಎಫ್ ಖಾತೆ ಸಂಖ್ಯೆ <span class="en">GPF</span></label>
            <input id="gpf" name="gpf" type="text" required maxlength="40">
          </div>
          <div class="field">
            <label for="doj">ಕರ್ತವ್ಯಕ್ಕೆ ವರದಿ ಮಾಡಿದ ದಿನಾಂಕ <span class="en">Date of joining</span></label>
            <input id="doj" name="doj" type="date" required>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ಕಚೇರಿ ವಿವರ <span class="en">Office</span></legend>
        <div class="grid">
          <div class="field">
            <label for="institution">ಸಂಸ್ಥೆ <span class="en">Institution</span></label>
            <input id="institution" name="institution" type="text" required maxlength="120"
                   placeholder="ಉದಾ: ಪಶು ಚಿಕಿತ್ಸಾಲಯ">
          </div>
          <div class="field">
            <label for="institutionplace">ಸಂಸ್ಥೆಯ ಸ್ಥಳ <span class="en">Place</span></label>
            <input id="institutionplace" name="institutionplace" type="text" required maxlength="120">
          </div>
          <div class="field">
            <label for="taluk">ತಾಲ್ಲೂಕು <span class="en">Taluk</span></label>
            <input id="taluk" name="taluk" type="text" required maxlength="80">
          </div>
          <div class="field">
            <label for="district">ಜಿಲ್ಲೆ <span class="en">District</span></label>
            <input id="district" name="district" type="text" required maxlength="80">
          </div>
          <div class="field">
            <label for="tono">ಗೆ ಪತ್ರ ಸಂಖ್ಯೆ ಮತ್ತು ದಿನಾಂಕ<span class="en">Letter no.</span></label>
            <input id="tono" name="tono" type="text" maxlength="60">
            <small class="hint">ಐಚ್ಛಿಕ</small>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ಖಜಾನೆ ವಿವರ <span class="en">Treasury</span></legend>
        <div class="grid">
          <div class="field">
            <label for="treasuryoffi">ಖಜಾನೆ ಅಧಿಕಾರಿ <span class="en">Treasury officer</span></label>
            <select id="treasuryoffi" name="treasuryoffi" required>
              <option value="" selected disabled>– ಆಯ್ಕೆ ಮಾಡಿ –</option>
              <option>ಉಪನಿರ್ದೇಶಕರು</option>
              <option>ಸಹಾಯಕ ನಿರ್ದೇಶಕರು</option>
              <option>ಉಪ ಖಜಾನಾಧಿಕಾರಿಗಳು</option>
            </select>
          </div>
          <div class="field">
            <label for="treasury">ಖಜಾನೆ ಪ್ರಕಾರ <span class="en">Treasury type</span></label>
            <select id="treasury" name="treasury" required>
              <option value="" selected disabled>– ಆಯ್ಕೆ ಮಾಡಿ –</option>
              <option>ಜಿಲ್ಲಾ ಖಜಾನೆ</option>
              <option>ತಾಲ್ಲೂಕು ಖಜಾನೆ</option>
              <option>ತಾಲ್ಲೂಕು ಉಪ ಖಜಾನೆ</option>
            </select>
          </div>
          <div class="field full">
            <label for="treasuryloc">ಖಜಾನೆ ಇರುವ ಸ್ಥಳ <span class="en">Treasury location</span></label>
            <input id="treasuryloc" name="treasuryloc" type="text" required maxlength="120">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>ದಾಖಲೆ <span class="en">Document</span></legend>
        <div class="grid">
          <div class="field">
            <label for="today">ದಾಖಲೆ ಸಲ್ಲಸಿದ ದಿನಾಂಕ <span class="en">Date on documents</span></label>
            <input id="today" name="today" type="date" required>
          </div>
        </div>
        <label class="check">
          <input id="remember" type="checkbox">
          ಕಚೇರಿ ಮತ್ತು ಖಜಾನೆ ವಿವರಗಳನ್ನು ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ನೆನಪಿಡಿ
          <small>ಹೆಸರು, ಪ್ರಾನ್, ಜಿಪಿಎಫ್ ಸಂಖ್ಯೆಗಳನ್ನು ಉಳಿಸಲಾಗುವುದಿಲ್ಲ</small>
        </label>
      </fieldset>

      <div class="actions">
        <button type="submit" value="pdf" class="btn primary">PDF ಡೌನ್‌ಲೋಡ್</button>
        <button type="submit" value="docx" class="btn secondary">Word (.docx) ಡೌನ್‌ಲೋಡ್</button>
        <button type="button" id="clearBtn" class="btn ghost">ಫಾರ್ಮ್ ತೆರವುಗೊಳಿಸಿ</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
